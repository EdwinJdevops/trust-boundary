name: Disposable Kubernetes enforcement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify local Docker and kubectl availability
        run: |
          docker info --format '{{.ServerVersion}}'
          kubectl version --client
      - name: Test actual credentials, RBAC, signed creation and recovery
        run: sudo env "PATH=$PATH" bash scripts/integration.sh
