name: Go verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - name: Static analysis
        run: go vet ./...
      - name: Race tests
        run: go test -race -count=1 ./...
