# Disposable integration fixture. Install only with a separate cluster administrator.
apiVersion: v1
kind: Namespace
metadata:
  name: tb-control
---
apiVersion: v1
kind: Namespace
metadata:
  name: tb-caller
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: executor
  namespace: tb-control
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caller
  namespace: tb-caller
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-create
  namespace: staging
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [app]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: protected-executor
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: executor
    namespace: tb-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-create
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: trust-boundary-experiment
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
  validations:
    - expression: "(!has(object.spec.template.spec.hostNetwork) || !object.spec.template.spec.hostNetwork) && (!has(object.spec.template.spec.hostPID) || !object.spec.template.spec.hostPID) && (!has(object.spec.template.spec.hostIPC) || !object.spec.template.spec.hostIPC)"
      message: Host namespaces denied
    - expression: "has(object.spec.template.spec.securityContext) && has(object.spec.template.spec.securityContext.runAsNonRoot) && object.spec.template.spec.securityContext.runAsNonRoot && has(object.spec.template.spec.securityContext.seccompProfile) && object.spec.template.spec.securityContext.seccompProfile.type == 'RuntimeDefault'"
      message: Non-root RuntimeDefault pod security required
    - expression: "object.spec.template.spec.containers.all(c, has(c.securityContext) && (!has(c.securityContext.privileged) || !c.securityContext.privileged) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop == ['ALL'] && (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0))"
      message: Container privilege escalation denied
    - expression: "object.spec.template.spec.containers.all(c, (!has(c.envFrom) || size(c.envFrom) == 0) && (!has(c.env) || size(c.env) == 0) && (!has(c.volumeMounts) || size(c.volumeMounts) == 0))"
      message: Environment and mount credential injection denied
    - expression: "request.userInfo.username == 'system:serviceaccount:tb-control:executor'"
      message: Only the protected test executor may submit Deployments
    - expression: "object.metadata.name == 'app' && object.spec.replicas >= 1 && object.spec.replicas <= 10"
      message: Only the bounded app workload is permitted
    - expression: "!has(object.spec.template.spec.serviceAccountName) || object.spec.template.spec.serviceAccountName == 'default'"
      message: Workloads cannot select privileged service accounts
    - expression: "has(object.spec.template.spec.automountServiceAccountToken) && !object.spec.template.spec.automountServiceAccountToken"
      message: Workload token mount must be disabled
    - expression: "!has(object.spec.template.spec.volumes) || size(object.spec.template.spec.volumes) == 0"
      message: Secret and host volume injection denied
    - expression: "(!has(object.spec.template.spec.initContainers) || size(object.spec.template.spec.initContainers) == 0) && size(object.spec.template.spec.containers) == 1"
      message: Additional execution denied
    - expression: "object.spec.template.spec.containers.all(c, c.image.matches('^[a-zA-Z0-9][a-zA-Z0-9._:/-]*@sha256:[a-f0-9]{64}$') && has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem)"
      message: Digest pinning and read-only root filesystem required
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: trust-boundary-experiment
spec:
  policyName: trust-boundary-experiment
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: staging
